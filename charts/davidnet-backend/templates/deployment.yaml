apiVersion: apps/v1
kind: Deployment
metadata:
  name: davidnet-backend
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: davidnet-backend
spec:
  replicas: {{ .Values.replicaCount }}
  # maxUnavailable: 0 guarantees no capacity dip - the old pod is only killed after the new one is
  # Ready. maxSurge: 1 bounds the rollout to one extra pod at a time, appropriate for this
  # cluster's size (vs. the 25%-of-fleet defaults meant for much larger clusters).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: davidnet-backend
  template:
    metadata:
      labels:
        app: davidnet-backend
    spec:
      # 3s readiness-propagation wait + WS/HTTP drain + DB/Redis disconnect + margin - set
      # explicitly rather than left at the k8s default (30s), to match the shutdown sequence in
      # src/index.ts and the lease timings in quiz_realtime.ts.
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: db-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bun", "run", "meta/scripts/migrateDB.ts"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bun", "run", "dist/index.js"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3020
          # readinessProbe fails immediately once graceful shutdown starts (see
          # src/core/health/shutdownState.ts), dropping this pod from the Service's endpoints
          # before the drain sequence begins closing connections. livenessProbe hits a separate
          # unconditional endpoint so an intentionally-draining pod is never killed early by its
          # own liveness check.
          readinessProbe:
            httpGet:
              path: /health
              port: 3020
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3020
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_NAME
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: EMAIL
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: EMAIL_PASSWORD
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_REFRESH_SECRET
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_ACCESS_SECRET
            - name: OIDC_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: oidc-private-key
            - name: GARAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GARAGE_ACCESS_KEY
            - name: GARAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GARAGE_SECRET_KEY
            - name: HEADSCALE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headscale-secret
                  key: HEADSCALE_CLIENT_SECRET
            - name: DISCORD_ACTIVITY_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-activity-webhook
                  key: DISCORD_ACTIVITY_WEBHOOK_URL
            - name: HEADSCALE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: headscale-secret
                  key: HEADSCALE_REDIRECT_URI
            - name: FORGEJO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: FORGEJO_CLIENT_SECRET
            - name: FORGEJO_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: FORGEJO_REDIRECT_URI
            - name: REDIS_URL
              value: "redis://redis.redis.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_PASSWORD
