apiVersion: apps/v1
kind: Deployment
metadata:
  name: davidnet-backend
  namespace: {{.Release.Namespace}}
  labels:
    app: davidnet-backend
spec:
  replicas: {{.Values.replicaCount}}
  selector:
    matchLabels:
      app: davidnet-backend
  template:
    metadata:
      labels:
        app: davidnet-backend
    spec:
      initContainers:
        - name: db-migrate
          image: "{{.Values.image.repository}}:{{.Values.image.tag}}"
          imagePullPolicy: {{.Values.image.pullPolicy}}
          command: ["bun", "run", "db:migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
      containers:
        - name: backend
          image: "{{.Values.image.repository}}:{{.Values.image.tag}}"
          imagePullPolicy: {{.Values.image.pullPolicy}}
          command: ["bun", "run", "index.js"]
          ports:
            - containerPort: {{.Values.service.port}}
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_NAME
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: EMAIL
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: EMAIL_PASSWORD
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_REFRESH_SECRET
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_ACCESS_SECRET
