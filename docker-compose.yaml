# ONLY MEANT FOR DEVELOPMENT USE!

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-my_database}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql
    restart: unless-stopped

  adminer:
    image: msav/adminer-autologin:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DRIVER: pgsql
      ADMINER_SERVER: database
      ADMINER_USERNAME: ${DB_USER:-postgres}
      ADMINER_PASSWORD: ${DB_PASSWORD:-password}
      ADMINER_DB: ${DB_NAME:-my_database}
    depends_on:
      - database
    restart: unless-stopped

  # S3-compatible storage for local dev, mirroring the Garage cluster used in prod.
  # The backend talks to it via GARAGE_ENDPOINT/GARAGE_ACCESS_KEY/GARAGE_SECRET_KEY (see .env.example).
  garage:
    image: dxflrs/garage:v2.3.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-23d822e4b77e16c51349e7846950f3cb95cc9b4e8268bb0f9567c98735caddf4}
    command: ["/garage", "server", "--single-node"]
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./volumes/garage:/data
    restart: unless-stopped

  # One-shot bootstrap: creates the dev access key + the buckets the backend expects
  # (profile-pictures, banner-pictures, shorts, communitygames, quiz-images), then exits.
  # Re-running it (e.g. on every `docker compose up`) is safe — every step is idempotent.
  # Image/entrypoint are defined in garage/Dockerfile (also published as
  # ghcr.io/davidnet-net/garage-init for the cluster's equivalent sidecar).
  garage-init:
    build:
      context: ./garage
    environment:
      GARAGE_CONFIG: /etc/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-23d822e4b77e16c51349e7846950f3cb95cc9b4e8268bb0f9567c98735caddf4}
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-devaccesskeydevaccesskey}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY:-devsecretkeydevsecretkeydevsecretkeydevsecretkey}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      # Needs access to Garage's own metadata dir to authenticate as a CLI peer of the node
      # (same reason `kubectl exec ... -- /garage` only works run from inside the Garage pod).
      - ./volumes/garage:/data
    network_mode: "service:garage"
    depends_on:
      - garage
    restart: "no"

volumes:
  pgdata:
